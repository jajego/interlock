name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes: { label: Observed behavior }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction }
    validations: { required: true }
  - type: textarea
    id: versions
    attributes: { label: Versions }
    validations: { required: true }
  - type: textarea
    id: database
    attributes: { label: PostgreSQL schema and isolation details }
  - type: textarea
    id: logs
    attributes: { label: Relevant error code and logs }
