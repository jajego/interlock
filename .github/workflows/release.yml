name: Release
on: { workflow_dispatch: {} }
permissions: { contents: write, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: interlock,
            POSTGRES_PASSWORD: interlock,
            POSTGRES_DB: interlock,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interlock" --health-interval 2s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://interlock:interlock@localhost:5432/interlock
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 26, registry-url: "https://registry.npmjs.org" }
      - uses: pnpm/action-setup@v6
        with: { version: 11.18.0 }
      - run: npm install --global npm@11 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:postgres
      - run: pnpm pack:check
      - run: pnpm --filter @jajego/interlock-prisma-postgres-spike generate
      - run: pnpm --filter @jajego/interlock-prisma-postgres-spike start
      - run: pnpm --filter @jajego/interlock-reference-app generate
      - run: pnpm --filter @jajego/interlock-reference-app migrate
      - run: pnpm --filter @jajego/interlock-reference-app seed
      - run: pnpm --filter @jajego/interlock-reference-app build
      - run: pnpm --filter @jajego/interlock-reference-app test
      - run: pnpm --filter @jajego/interlock-reference-app verify:packed
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish packages
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: git push --follow-tags
