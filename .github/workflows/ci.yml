name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: interlock,
            POSTGRES_PASSWORD: interlock,
            POSTGRES_DB: interlock,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interlock" --health-interval 2s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://interlock:interlock@localhost:5432/interlock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26 }
      - uses: pnpm/action-setup@v6
        with: { version: 11.18.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm check
      - run: node --test integration/core.test.mjs
      - run: pnpm test:postgres
      - run: pnpm pack:check
      - run: pnpm --filter @interlock/prisma-postgres-spike generate
      - run: pnpm --filter @interlock/prisma-postgres-spike start
