name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: interlock,
            POSTGRES_PASSWORD: interlock,
            POSTGRES_DB: interlock,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interlock" --health-interval 2s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://interlock:interlock@localhost:5432/interlock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:postgres
      - run: pnpm pack:check
