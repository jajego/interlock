services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interlock
      POSTGRES_PASSWORD: interlock
      POSTGRES_DB: interlock
    ports: ["54329:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interlock"]
      interval: 1s
      timeout: 3s
      retries: 30
